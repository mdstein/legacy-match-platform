user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Cloudflare Tunnel terminates the public connection. Collapse its trusted
  # client header to one hop before handing the request to Express, which
  # trusts only this Nginx proxy. The fallback preserves local host probes.
  map $http_cf_connecting_ip $aftertick_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
  }
  map $http_x_forwarded_proto $aftertick_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    set $aftertick_api http://api:8787;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data: https://community.fastly.steamstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://steamcommunity.com" always;

    location /api/events {
      proxy_pass $aftertick_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $aftertick_client_ip;
      proxy_set_header X-Forwarded-For $aftertick_client_ip;
      proxy_set_header X-Forwarded-Proto $aftertick_forwarded_proto;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    # GOTV demos are streamed by authenticated game nodes. Nginx defaults to
    # rejecting request bodies over 1 MiB, which stranded completed servers in
    # drain when a normal demo crossed that threshold.
    location ~ "^/api/node/v1/matches/[0-9a-fA-F-]{36}/demo$" {
      client_max_body_size 100m;
      proxy_request_buffering off;
      proxy_pass $aftertick_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $aftertick_client_ip;
      proxy_set_header X-Forwarded-For $aftertick_client_ip;
      proxy_set_header X-Forwarded-Proto $aftertick_forwarded_proto;
      proxy_send_timeout 10m;
      proxy_read_timeout 10m;
    }

    location /api/ {
      proxy_pass $aftertick_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $aftertick_client_ip;
      proxy_set_header X-Forwarded-For $aftertick_client_ip;
      proxy_set_header X-Forwarded-Proto $aftertick_forwarded_proto;
      proxy_read_timeout 60s;
    }

    location = /health {
      proxy_pass $aftertick_api/health;
    }

    location = /ready {
      proxy_pass $aftertick_api/ready;
    }

    location = /metrics {
      proxy_pass $aftertick_api/metrics;
    }

    # Public, versioned launcher artifacts are bundled with the web release.
    # Missing downloads must return 404 instead of falling back to the app shell.
    location /downloads/ {
      try_files $uri =404;
    }

    # The app shell must revalidate on every visit so a deployment cannot leave
    # players pinned to an older hashed asset graph in their browser cache.
    location = /index.html {
      expires -1;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
