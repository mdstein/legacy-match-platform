global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aftertick-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8787"]

  - job_name: aftertick-telemetry
    static_configs:
      - targets: ["otel-collector:8888", "tempo:3200"]
