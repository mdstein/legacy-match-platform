route:
  receiver: local-alert-console
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-alert-console

# Private-alpha paging destinations are deliberately credential-free here.
# Add a PagerDuty, Opsgenie, Slack, or authenticated webhook receiver during
# deployment and keep its secret in the deployment secret manager.
