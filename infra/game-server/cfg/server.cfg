hostname "B2G Match Server"
// Use the engine's native CS:GO occlusion rather than SMAC's unsupported
// Source 1 wallhack module.
sv_occlude_players 1
sv_cheats 0
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0
sv_allow_votes 0
sv_allow_lobby_connect_only 0
// Provisioning renders rcon_password and the non-match idle sv_password into
// aftertick-secrets.cfg. Keep credentials out of this tracked file.
exec aftertick-secrets.cfg

log on
sv_logfile 1
sv_logecho 1
sv_log_onefile 0

tv_enable 1
tv_name "B2G GOTV"
// Match manifests own deterministic recording names and upload destinations.
tv_autorecord 0
tv_delay 0
tv_port 27120

mp_autoteambalance 0
mp_limitteams 0
mp_warmuptime 300
mp_warmup_pausetimer 1
mp_match_end_restart 0
mp_match_restart_delay 15

aftertick_match_id ""
aftertick_mode "competitive"
aftertick_roster_t ""
aftertick_roster_ct ""
aftertick_roster_ffa ""
aftertick_deathmatch_empty_seconds 60
// Disabled by default. Operators may briefly enable it for a controlled,
// clearly labeled end-to-end evidence-pipeline test, then must disable it.
aftertick_anticheat_self_test_enabled 0
aftertick_auto_start 1
aftertick_no_show_seconds 300

// Competitive preparation sets this to zero. Drop-in Deathmatch overrides it
// to 14/fill so humans automatically replace bots and disconnects backfill.
bot_quota 0
bot_quota_mode fill
bot_auto_vacate 1
bot_join_after_player 0
